<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CRM Solar</title>

    <!-- Tipografia. Antes esta pagina carregava Poppins e o CRM declarava
         Inter: duas identidades no mesmo produto, na mesma jornada. Agora as
         duas telas de login carregam a mesma pilha. Fraunces so aparece em
         figura de display >= 24px. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,400..700&display=swap">

    <!-- Font Awesome: o icone do lockup e os icones de status dos alertas
         saem daqui. Status nunca e so cor, entao a fonte de icone e
         requisito funcional, nao enfeite. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =================================================================
           1. TOKENS — "Papel e Mesa"
           Mesmos papeis declarados no crm/index.html. Escrevemos contra o
           papel, nunca contra o hex: trocar a marca passa a ser trocar
           cinco linhas aqui, nas duas telas.
           ================================================================= */
        :root {
            /* Marca. O #667eea/#764ba2 que esta pagina usava nao pertencia a
               marca nenhuma, e o #309086 do CRM reprovava (3,85:1 com texto
               branco). Esta escala preserva a matiz e corrige o contraste. */
            --brand-300: #8FC9C1;
            --brand-400: #5FAEA4;
            --brand-500: #3B9287;   /* ornamento, bordas — NAO para texto */
            --brand-600: #297A72;   /* texto, links, botoes — 5,10:1 em branco */
            --brand-700: #1A5952;   /* hover, enfase — 8,09:1 */

            /* Tinta. Piso estrutural: nenhum destes fica abaixo de 4,5:1 na
               PIOR superficie do sistema (--sunken). Nao existe tom mais
               fraco disponivel — e por isso que placeholder e rotulo nao tem
               como reprovar aqui. */
            --ink-1: #16211F;       /* 14,64:1 */
            --ink-2: #3D4744;       /*  8,53:1 */
            --ink-3: #5A6764;       /*  5,23:1 — rotulos, placeholders */

            --ink-sobre-marca: #FFFFFF;   /* 8,09:1 sobre --brand-700 */

            /* Superficies */
            --paper:  #FBFAF7;      /* fundo de pagina (registro externo) */
            --card:   #FFFFFF;
            --sunken: #F4F1EA;
            --rule:   #D9D3C6;      /* fios estruturais — 2px, nunca 1px */

            /* Status — reservados, nunca reutilizados como serie */
            --ok:      #1B7A4B;
            --atencao: #9A6209;
            --grave:   #B3421C;
            --critico: #A3231F;
            --info:    #1F5F8B;

            /* Tipografia */
            --fonte-texto:  'Inter', system-ui, -apple-system, sans-serif;
            --fonte-numero: 'Atkinson Hyperlegible', 'Inter', sans-serif;
            --fonte-titulo: 'Fraunces', Georgia, serif;   /* SOMENTE >= 24px */

            /* Espacamento — registro EXTERNO (calmo). Quem chega aqui vai
               assinar R$ 50 mil: densidade aqui parece desleixo. */
            --pad-card-fora:  32px;
            --pad-campo-fora: 18px;

            --raio:      6px;
            --raio-fora: 10px;

            /* Ornamento unico: brilho do fio ambar. Sobrescrito no
               carregamento pela hora solar local. */
            --luz: 72%;
        }

        /* =================================================================
           2. BASE
           ================================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fonte-texto);
            min-height: 100vh;
            /* Papel, nao gradiente de marca. O ornamento carrega a
               identidade; o fundo so precisa dar respiro. */
            background: var(--paper);
            background-image: linear-gradient(180deg, var(--sunken) 0%, var(--paper) 42%);
            background-repeat: no-repeat;
            color: var(--ink-1);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
        }

        /* Foco visivel sempre: quem entra por teclado precisa saber onde
           esta antes de digitar a senha. */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--brand-600);
            outline-offset: 2px;
        }

        /* =================================================================
           3. O ORNAMENTO UNICO: A LINHA DO HORIZONTE
           Fio ambar de 2px cujo brilho acompanha a hora solar local.
           Aparece UMA vez nesta pagina, sob o lockup da marca, e em nenhum
           outro lugar — e o que costura login, CRM e proposta.
           ================================================================= */
        .fio-horizonte {
            height: 2px;
            border: 0;
            background: linear-gradient(90deg,
                var(--atencao) 0%,
                hsl(38 95% calc(32% + var(--luz) * 0.34)) 50%,
                var(--atencao) 100%);
        }

        /* =================================================================
           4. O CARD
           Elevacao por fio de 2px, nunca por sombra difusa: 1px a 1,2:1
           desaparece em monitor TN descalibrado com sol na janela, que e o
           hardware real deste publico.
           ================================================================= */
        .login-container {
            width: 100%;
            max-width: 432px;
        }

        .login-card {
            background: var(--card);
            border: 2px solid var(--rule);
            border-radius: var(--raio-fora);
            padding: var(--pad-card-fora);
            box-shadow: none;
        }

        /* =================================================================
           5. LOCKUP E CABECALHOS
           ================================================================= */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        /* O lockup da marca aparece so na chegada (tela de login). Cadastro
           e recuperacao sao estados da mesma tela: repetir o lockup — e com
           ele o ornamento — gastaria o unico gesto de marca do sistema. */
        .login-logo {
            display: block;
            margin-bottom: 10px;
        }

        .login-logo i {
            font-size: 30px;
            color: var(--brand-600);
        }

        .login-title {
            font-family: var(--fonte-titulo);
            font-optical-sizing: auto;
            font-size: 30px;        /* a serifada e faca: so >= 24px */
            font-weight: 600;
            line-height: 1.15;
            color: var(--ink-1);
            margin-bottom: 12px;
        }

        .login-header .fio-horizonte {
            width: 120px;
            margin: 0 auto 12px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--ink-3);
        }

        /* =================================================================
           6. CAMPOS
           ================================================================= */
        .form-group {
            margin-bottom: var(--pad-campo-fora);
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px var(--pad-campo-fora);
            border: 2px solid var(--rule);
            border-radius: var(--raio);
            font-size: 15px;
            font-family: var(--fonte-texto);
            color: var(--ink-1);
            background: var(--card);
            outline: none;
        }

        /* Placeholder tambem passa no piso de 4,5:1. O opacity: 1 e
           obrigatorio: o default do Firefox apaga o texto. */
        .form-input::placeholder {
            color: var(--ink-3);
            opacity: 1;
        }

        /* O telefone e figura que a pessoa confere digito por digito.
           Atkinson Hyperlegible tem 1/l/I e 0/O inequivocos. */
        #registerTelefone {
            font-family: var(--fonte-numero);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }

        .form-input:focus {
            border-color: var(--brand-600);
            box-shadow: inset 0 0 0 1px var(--brand-600);
        }

        /* Erro de campo nunca so por cor: a borda engrossa e o rotulo
           abaixo do campo diz o que esta errado. */
        .form-input.error {
            border-color: var(--critico);
            box-shadow: inset 0 0 0 1px var(--critico);
        }

        select.form-input {
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%),
                              linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
            background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            padding-right: 40px;
            cursor: pointer;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            padding: 4px;
            background: none;
            border: none;
            border-radius: var(--raio);
            cursor: pointer;
            color: var(--ink-3);   /* 5,23:1 — era #9ca3af, 2,54:1 */
        }

        .password-toggle:hover {
            color: var(--brand-700);
        }

        .form-error {
            align-items: flex-start;
            gap: 8px;
            font-size: 13px;
            color: var(--critico);   /* 7,14:1 como texto */
            margin-top: 8px;
            display: none;
        }

        .form-error.visible {
            display: flex;
        }

        /* Icone + palavra: o fa-circle-exclamation entra por pseudo-elemento
           porque o JS mexe na className deste elemento. */
        .form-error::before {
            content: '\f06a';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            flex: 0 0 auto;
            line-height: 1.45;
        }

        /* Row for two inputs */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* =================================================================
           7. BOTOES
           O setLoading() sobrescreve o innerHTML do botao e depois restaura
           por btn.dataset.originalText, que vem de btn.textContent. Por isso
           nenhum botao depende de filho nenhum: toda a aparencia vem do
           proprio elemento, e o estado de carga e estilizado pelas classes
           que a propria funcao escreve (.btn-loading, .spinner).
           ================================================================= */
        .btn {
            width: 100%;
            padding: 13px 20px;
            border: 2px solid transparent;
            border-radius: var(--raio);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--fonte-texto);
        }

        .btn-primary {
            background: var(--brand-600);
            border-color: var(--brand-600);
            color: var(--ink-sobre-marca);   /* 5,10:1 */
        }

        .btn-primary:hover {
            background: var(--brand-700);
            border-color: var(--brand-700);
        }

        /* Desabilitado se expressa por borda tracejada + cursor + rotulo,
           nunca por opacidade: opacidade apaga texto e e o caminho mais
           curto para reprovar o piso de 4,5:1. O rotulo ("Aguarde...") vem
           do setLoading(). */
        .btn:disabled {
            opacity: 1;
            background: var(--sunken);
            border: 2px dashed var(--rule);
            color: var(--ink-2);        /* 8,53:1 sobre --sunken */
            cursor: progress;
            box-shadow: none;
        }

        .btn-secondary {
            background: var(--card);
            border-color: var(--rule);
            color: var(--ink-1);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--sunken);
        }

        .btn-loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* O spinner gira contra currentColor porque o botao em carga fica
           claro (--sunken): um aro branco seria invisivel ali. */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--rule);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Quem pediu menos movimento nao precisa de um aro girando na tela. */
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2.4s; }
        }

        /* =================================================================
           8. ALERTAS
           ARMADILHA: showAlert() faz
               alert.className = `alert alert-${type} visible`
           ou seja, reescreve a className INTEIRA e apaga qualquer classe de
           layout que o redesenho adicione no markup. Entao todo o estilo
           abaixo pende das tres classes que a propria funcao escreve — mais
           nenhuma. E o icone entra por ::before, que innerHTML/className nao
           alcancam.
           ================================================================= */
        .alert {
            padding: 14px 16px;
            border: 2px solid var(--rule);
            border-left-width: 6px;
            border-radius: var(--raio);
            background: var(--card);
            color: var(--ink-1);
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: var(--pad-campo-fora);
            display: none;
        }

        .alert.visible {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert::before {
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            flex: 0 0 auto;
            line-height: 1.45;
        }

        .alert-success {
            border-color: var(--ok);
        }

        .alert-success::before {
            content: '\f058';           /* fa-circle-check */
            color: var(--ok);
        }

        .alert-error {
            border-color: var(--critico);
        }

        .alert-error::before {
            content: '\f06a';           /* fa-circle-exclamation */
            color: var(--critico);
        }

        /* =================================================================
           9. ALTERNANCIA ENTRE OS TRES FORMULARIOS
           O JS alterna .hidden em #loginForm e .visible em #registerForm /
           #forgotForm. As regras ficam ancoradas tambem no id, para o caso
           de a classe de layout sair do markup.
           ================================================================= */
        .login-form.hidden,
        #loginForm.hidden {
            display: none;
        }

        .register-form,
        .forgot-form {
            display: none;
        }

        .register-form.visible,
        .forgot-form.visible {
            display: block;
        }

        /* =================================================================
           10. LINKS E AUXILIARES
           ================================================================= */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 2px;              /* estrutura usa 2px */
            background: var(--rule);
        }

        .divider-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .forgot-password {
            text-align: right;
            margin-bottom: var(--pad-campo-fora);
        }

        .forgot-password a,
        .register-link a {
            color: var(--brand-600);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .forgot-password a {
            font-size: 13px;
        }

        .forgot-password a:hover,
        .register-link a:hover,
        .back-link:hover {
            color: var(--brand-700);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--ink-2);      /* 8,53:1 — era #6b7280 */
        }

        .register-link a {
            font-weight: 600;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--brand-600);
            text-decoration: none;
            margin-bottom: 24px;
        }

        .back-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        /* =================================================================
           11. TELA ESTREITA
           ================================================================= */
        @media (max-width: 480px) {
            .login-card { padding: 24px 20px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .login-title { font-size: 26px; }
        }
    </style>

    <script>
        // O ornamento unico do sistema. --luz sai da hora solar local e e
        // definida UMA vez, antes do primeiro paint, para o fio nunca
        // piscar. Nao depende de dado nenhum, entao nunca quebra.
        (function () {
            var h = new Date().getHours();
            var luz = Math.max(0, Math.round(100 * Math.sin(Math.PI * (h - 6) / 12)));
            document.documentElement.style.setProperty('--luz', luz + '%');
        })();
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Login Form -->
            <div class="login-form" id="loginForm">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="fas fa-sun" aria-hidden="true"></i>
                    </div>
                    <h1 class="login-title">CRM Solar</h1>
                    <!-- Horizonte sob o lockup: o unico lugar onde o
                         ornamento aparece nesta pagina. -->
                    <div class="fio-horizonte" aria-hidden="true"></div>
                    <p class="login-subtitle">Entre na sua conta para continuar</p>
                </div>

                <div class="alert alert-error" id="loginAlert" role="alert"></div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">E-mail</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="voce@empresa.com" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="loginPassword" placeholder="Sua senha" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')" aria-label="Mostrar ou ocultar a senha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" onclick="showForgotForm()">Esqueci minha senha</a>
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        Entrar
                    </button>
                </form>

                <div class="register-link">
                    Ainda não tem conta? <a href="#" onclick="showRegisterForm()">Cadastre-se grátis</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="register-form" id="registerForm">
                <a href="#" class="back-link" onclick="showLoginForm()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Voltar ao login
                </a>

                <div class="login-header">
                    <h1 class="login-title">Criar Conta</h1>
                    <p class="login-subtitle">Cadastre sua empresa e comece a usar</p>
                </div>

                <div class="alert" id="registerAlert" role="alert"></div>

                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label" for="registerEmpresa">Nome da Empresa</label>
                        <input type="text" class="form-input" id="registerEmpresa" placeholder="Minha Empresa Solar" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="registerNome">Seu Nome</label>
                            <input type="text" class="form-input" id="registerNome" placeholder="João Silva" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="registerCargo">Cargo</label>
                            <select class="form-input" id="registerCargo">
                                <option value="admin">Administrador</option>
                                <option value="gerente">Gerente</option>
                                <option value="vendedor">Vendedor</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerEmail">E-mail</label>
                        <input type="email" class="form-input" id="registerEmail" placeholder="voce@empresa.com" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerTelefone">Telefone</label>
                        <input type="tel" class="form-input" id="registerTelefone" placeholder="(11) 99999-9999" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerPassword">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="registerPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
                            <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')" aria-label="Mostrar ou ocultar a senha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerPasswordConfirm">Confirmar Senha</label>
                        <input type="password" class="form-input" id="registerPasswordConfirm" placeholder="Repita a senha" autocomplete="new-password" required>
                        <p class="form-error" id="passwordError">As senhas não conferem</p>
                    </div>

                    <button type="submit" class="btn btn-primary" id="registerBtn">
                        Criar Conta Grátis
                    </button>
                </form>
            </div>

            <!-- Forgot Password Form -->
            <div class="forgot-form" id="forgotForm">
                <a href="#" class="back-link" onclick="showLoginForm()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Voltar ao login
                </a>

                <div class="login-header">
                    <h1 class="login-title">Recuperar Senha</h1>
                    <p class="login-subtitle">Digite seu e-mail para receber o link de recuperação</p>
                </div>

                <div class="alert" id="forgotAlert" role="alert"></div>

                <form onsubmit="handleForgotPassword(event)">
                    <div class="form-group">
                        <label class="form-label" for="forgotEmail">E-mail</label>
                        <input type="email" class="form-input" id="forgotEmail" placeholder="voce@empresa.com" autocomplete="email" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="forgotBtn">
                        Enviar Link de Recuperação
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuração Supabase
        const SUPABASE_URL = 'https://zralzmgsdmwispfvgqvy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyYWx6bWdzZG13aXNwZnZncXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MzA1NTYsImV4cCI6MjA3OTQwNjU1Nn0.lAarNVapj0c6A-1ix6PISUya0wMcRzruta1GECtwDD8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Verificar se já está logado
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }
        checkAuth();

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // Show/Hide forms
        function showLoginForm() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.remove('visible');
            document.getElementById('forgotForm').classList.remove('visible');
            clearAlerts();
        }

        function showRegisterForm() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('visible');
            document.getElementById('forgotForm').classList.remove('visible');
            clearAlerts();
        }

        function showForgotForm() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('visible');
            document.getElementById('forgotForm').classList.add('visible');
            clearAlerts();
        }

        function clearAlerts() {
            document.querySelectorAll('.alert').forEach(el => {
                el.classList.remove('visible');
                el.textContent = '';
            });
        }

        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = `alert alert-${type} visible`;
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="btn-loading"><span class="spinner"></span> Aguarde...</span>';
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || 'Enviar';
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const btn = document.getElementById('loginBtn');
            btn.dataset.originalText = btn.textContent;
            setLoading('loginBtn', true);

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                // Redirecionar para o CRM
                window.location.href = 'index.html';

            } catch (error) {
                console.error('Erro no login:', error);
                let message = 'Erro ao fazer login. Tente novamente.';
                if (error.message.includes('Invalid login')) {
                    message = 'E-mail ou senha incorretos';
                }
                showAlert('loginAlert', message, 'error');
            } finally {
                setLoading('loginBtn', false);
                document.getElementById('loginBtn').textContent = 'Entrar';
            }
        }

        // Handle Register
        async function handleRegister(e) {
            e.preventDefault();

            const empresaNome = document.getElementById('registerEmpresa').value;
            const nome = document.getElementById('registerNome').value;
            const cargo = document.getElementById('registerCargo').value;
            const email = document.getElementById('registerEmail').value;
            const telefone = document.getElementById('registerTelefone').value;
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            // Validar senhas
            if (password !== passwordConfirm) {
                document.getElementById('passwordError').classList.add('visible');
                return;
            }
            document.getElementById('passwordError').classList.remove('visible');

            const btn = document.getElementById('registerBtn');
            btn.dataset.originalText = btn.textContent;
            setLoading('registerBtn', true);

            try {
                // 1. Primeiro criar a empresa
                const { data: empresaData, error: empresaError } = await supabase
                    .from('empresas')
                    .insert({ nome: empresaNome })
                    .select()
                    .single();

                if (empresaError) throw empresaError;

                const empresaId = empresaData.id;

                // 2. Criar usuário no Supabase Auth com empresa_id nos metadados
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            nome: nome,
                            empresa_id: empresaId,
                            role: cargo === 'admin' ? 'admin' : 'user',
                            telefone: telefone
                        }
                    }
                });

                if (error) {
                    // Se falhar ao criar usuário, deletar a empresa criada
                    await supabase.from('empresas').delete().eq('id', empresaId);
                    throw error;
                }

                showAlert('registerAlert', 'Conta criada com sucesso! Verifique seu e-mail para confirmar o cadastro.', 'success');

                // Limpar formulário
                e.target.reset();

            } catch (error) {
                console.error('Erro no cadastro:', error);
                let message = 'Erro ao criar conta. Tente novamente.';
                if (error.message.includes('already registered')) {
                    message = 'Este e-mail já está cadastrado';
                }
                showAlert('registerAlert', message, 'error');
            } finally {
                setLoading('registerBtn', false);
                document.getElementById('registerBtn').textContent = 'Criar Conta Grátis';
            }
        }

        // Handle Forgot Password
        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;

            const btn = document.getElementById('forgotBtn');
            btn.dataset.originalText = btn.textContent;
            setLoading('forgotBtn', true);

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/crm/reset-password.html'
                });

                if (error) throw error;

                showAlert('forgotAlert', 'E-mail enviado! Verifique sua caixa de entrada.', 'success');

            } catch (error) {
                console.error('Erro na recuperação:', error);
                showAlert('forgotAlert', 'Erro ao enviar e-mail. Verifique o endereço e tente novamente.', 'error');
            } finally {
                setLoading('forgotBtn', false);
                document.getElementById('forgotBtn').textContent = 'Enviar Link de Recuperação';
            }
        }
    </script>
</body>
</html>
